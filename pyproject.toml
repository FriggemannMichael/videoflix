[project]
name = "videoflix"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django~=5.2.0",
    "django-redis>=7.0.0",
    "django-rq>=4.1.1",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
    "T20",
    "PLR0915",
    "D101",
]
ignore = [
    "DJ001",
]

[tool.ruff.lint.pylint]
max-statements = 14

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR0915"]
"**/*_tests.py" = ["PLR0915"]
"**/tests.py" = ["PLR0915"]
"**/apps.py" = ["D101"]
"tests/scripts/check_size_limits.py" = ["T201"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-rxX",
    "--cov=.",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
omit = [
    ".venv/*",
    "*/migrations/*",
    "tests/*",
    "*/__init__.py",
    "manage.py",
    "core/asgi.py",
    "core/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
